# FLIR多模态数据集配置文件
# 多模态目标检测数据集 - RGB + 红外

# 数据集路径（相对于当前 YAML 文件）
train: FLIR_Aligned/images/train  # 训练集RGB图像路径
val: FLIR_Aligned/images/val      # 验证集RGB图像路径
test: FLIR_Aligned/images/test    # 测试集RGB图像路径

# 多模态路径配置
modalities:
  rgb: images      # RGB可见光图像模态路径
  ir: images_ir       # 红外图像模态路径

# 当前使用的模态组合
models: ['rgb','ir']  # 本次训练使用的模态：RGB + 红外

# 类别信息 
names:
  0: person
  1: car
  2: bicycle
  3: dog
  
